
services:
  postgres:
    image: postgres:16-alpine
    container_name: nonegaran-postgres
    environment:
      POSTGRES_USER: nonegaran
      POSTGRES_PASSWORD: nonegaran_password
      POSTGRES_DB: nonegaran_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
